<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aramé · Cocina armenia</title>
<meta name="description" content="Aramé, cocina armenia take away en Martínez. Armá tu pedido online y envialo por WhatsApp.">
<meta name="theme-color" content="#0D0D0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&family=Noto+Serif+Armenian:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D0D0D; --bg-2:#131313; --card:#181818; --card-2:#202020;
    --ink:#F5F1EA; --ink-2:#B5ADA2; --ink-3:#7A736B;
    --line:#2A2A2A;
    --or:#F26A1B; --or-2:#FF8A3D; --or-deep:#C9520E; --or-soft:rgba(242,106,27,.14);
    --wa:#1FA855;
    --serif:"DM Serif Display",Georgia,serif;
    --body:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --hy:"Noto Serif Armenian",serif;
    --r:16px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
  h1,h2,h3{margin:0;line-height:1.1;font-weight:400}
  .container{max-width:1160px;margin:0 auto;padding:0 16px}

  /* encabezado */
  header{position:sticky;top:0;z-index:50;background:rgba(13,13,13,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;gap:14px;height:64px}
  .logo{display:flex;align-items:baseline;gap:9px}
  .logo b{font-family:var(--serif);font-weight:400;font-size:28px;color:var(--or);letter-spacing:.01em}
  .logo span{font-family:var(--hy);font-size:15px;color:var(--ink-3)}
  .cart-btn{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--or);color:#111;border:0;border-radius:999px;padding:10px 16px;font-weight:800;font-size:14px}
  .cart-btn .count{background:#111;color:var(--or);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;padding:0 6px}
  .cart-btn.bump{animation:bump .3s ease}
  @keyframes bump{50%{transform:scale(1.08)}}

  /* portada */
  .hero{padding:40px 0 26px;position:relative}
  .hero::before{content:"";position:absolute;inset:-64px 0 auto 0;height:420px;background:radial-gradient(60% 70% at 85% 0%,rgba(242,106,27,.22),transparent 70%);pointer-events:none}
  .hero .container{position:relative}
  .kicker{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--or)}
  .kicker::before{content:"";width:22px;height:2px;background:var(--or)}
  .hero h1{font-family:var(--serif);font-size:clamp(40px,7vw,76px);margin:14px 0 12px;letter-spacing:-.01em}
  .hero h1 em{color:var(--or);font-style:italic}
  .hero p{color:var(--ink-2);font-size:17px;max-width:560px;margin:0}
  .facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
  .fact{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13.5px;color:var(--ink-2)}
  .fact b{color:var(--ink);font-weight:700}
  .fact svg{color:var(--or);flex-shrink:0}
  .aviso{margin-top:18px;background:var(--or-soft);border:1px solid rgba(242,106,27,.4);color:var(--or-2);border-radius:12px;padding:12px 14px;font-weight:700;font-size:14.5px}

  /* categorías y buscador */
  .toolbar{position:sticky;top:64px;z-index:40;background:rgba(13,13,13,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 0}
  .toolbar .container{display:flex;gap:10px;align-items:center}
  .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
  .chip.on{background:var(--or);border-color:var(--or);color:#111}
  .search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;width:240px;flex-shrink:0;color:var(--ink-3)}
  .search input{border:0;background:none;outline:none;font:inherit;font-size:14px;width:100%;color:var(--ink)}
  @media(max-width:700px){
    .toolbar .container{flex-direction:column;align-items:stretch}
    .search{width:100%}
  }

  /* productos */
  .cat-block{padding:26px 0 6px;scroll-margin-top:130px}
  .cat-block h2{font-family:var(--serif);font-size:30px;margin-bottom:14px;display:flex;align-items:baseline;gap:10px}
  .cat-block h2 small{font-family:var(--body);font-size:13px;color:var(--ink-3);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s}
  .card.in{border-color:var(--or)}
  .ph{aspect-ratio:4/3;background:var(--card-2);position:relative;overflow:hidden;border:0;padding:0;display:block;width:100%}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph .none{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--hy);font-size:56px;color:rgba(242,106,27,.35);background:radial-gradient(circle at 50% 40%,#262019,#171717)}
  .ph .qbadge{position:absolute;top:10px;right:10px;background:var(--or);color:#111;font-weight:800;font-size:13px;border-radius:999px;padding:3px 10px}
  .body{padding:14px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
  .card h3{font-size:17px;font-weight:800;letter-spacing:-.005em}
  .peso{font-size:12.5px;color:var(--or-2);font-weight:700}
  .desc{margin:0;font-size:14px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .price-row{display:flex;align-items:baseline;gap:6px;margin-top:auto;padding-top:10px}
  .price{font-size:19px;font-weight:800}
  .price.na{font-size:14px;color:var(--ink-3);font-weight:700}
  .per{font-size:12.5px;color:var(--ink-3)}
  .ctrl{display:flex;align-items:center;gap:8px;margin-top:10px}
  .stepper{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden;flex:1;max-width:170px}
  .stepper button{width:42px;height:42px;border:0;background:none;font-size:20px;font-weight:700;color:var(--ink)}
  .stepper button:active{background:var(--card-2)}
  .stepper input{width:100%;min-width:0;height:42px;border:0;background:none;text-align:center;font:inherit;font-weight:800;font-size:16px;color:var(--ink);outline:none;-moz-appearance:textfield}
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .quick{height:42px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:none;font-weight:800;font-size:14px;color:var(--or-2)}
  .quick:active{background:var(--or-soft)}
  .card.off{opacity:.5}
  .off-tag{font-size:12.5px;font-weight:800;color:var(--ink-3);margin-top:10px}

  /* móvil: tarjetas horizontales para ver más productos */
  @media(max-width:600px){
    .grid{grid-template-columns:1fr;gap:10px}
    .card{flex-direction:row}
    .ph{width:118px;min-width:118px;aspect-ratio:auto;min-height:100%}
    .ph .none{font-size:38px}
    .ph .qbadge{top:6px;right:6px;font-size:12px;padding:2px 8px}
    .body{padding:12px}
    .card h3{font-size:16px}
    .desc{font-size:13px;-webkit-line-clamp:2}
    .price-row{padding-top:6px}
    .price{font-size:17px}
    .ctrl{gap:6px}
    .stepper button{width:36px;height:38px}
    .stepper input{height:38px}
    .quick{height:38px;padding:0 9px;font-size:13px}
  }

  .empty{padding:36px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:var(--r);margin-top:26px}
  .loading{padding:60px 0;text-align:center;color:var(--ink-3)}

  footer{padding:40px 0 120px;color:var(--ink-3);font-size:13.5px;border-top:1px solid var(--line);margin-top:40px}
  footer .container{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

  /* barra inferior con el total */
  .bar{position:fixed;left:50%;bottom:14px;transform:translate(-50%,140%);width:min(560px,calc(100% - 24px));z-index:60;display:flex;align-items:center;gap:12px;background:var(--or);color:#111;border:0;border-radius:16px;padding:12px 12px 12px 18px;box-shadow:0 16px 40px -12px rgba(242,106,27,.55);transition:transform .25s ease}
  .bar.show{transform:translate(-50%,0)}
  .bar .t{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;text-align:left}
  .bar .t small{font-weight:700;font-size:12.5px;opacity:.8}
  .bar .t b{font-size:19px}
  .bar .go{margin-left:auto;background:#111;color:var(--or);border-radius:11px;padding:11px 16px;font-weight:800;font-size:14.5px}

  /* carrito */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
  .overlay.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;height:100dvh;width:min(460px,100%);background:var(--bg-2);z-index:90;transform:translateX(100%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s;display:flex;flex-direction:column;overflow:hidden;border-left:1px solid var(--line)}
  .drawer.open{transform:none;visibility:visible;transition:transform .25s ease}
  .d-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
  .d-head h2{font-family:var(--serif);font-size:28px}
  .x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:17px}
  .d-body{flex:1;min-height:0;overflow-y:auto;padding:8px 18px 18px}
  .li{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
  .li .n{font-weight:700;font-size:15px}
  .li .n small{display:block;font-weight:500;color:var(--ink-3);font-size:12.5px}
  .li .tot{font-weight:800;text-align:right}
  .li .stepper{max-width:150px}
  .li .rm{background:none;border:0;color:var(--ink-3);font-size:13px;font-weight:700;text-decoration:underline;justify-self:end}
  .clear{background:none;border:0;color:var(--ink-3);font-size:13px;font-weight:700;text-decoration:underline;padding:12px 0 0}
  .form{display:flex;flex-direction:column;gap:12px;margin-top:20px}
  .form h3{font-family:var(--serif);font-size:22px}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
  .seg button{border:0;background:none;border-radius:9px;padding:10px;font-weight:800;font-size:14px;color:var(--ink-2)}
  .seg button.on{background:var(--or);color:#111}
  .form label{font-size:13px;font-weight:700;color:var(--ink-2);display:flex;flex-direction:column;gap:5px}
  .form input,.form textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none}
  .form input:focus,.form textarea:focus{border-color:var(--or)}
  .form .err{border-color:#E5484D}
  .d-foot{padding:14px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
  .sum{display:flex;justify-content:space-between;align-items:baseline;font-size:20px;font-weight:800}
  .note{font-size:12.5px;color:var(--ink-3);margin:6px 0 0}
  .send{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;margin-top:12px;background:var(--wa);color:#fff;border:0;border-radius:14px;padding:15px;font-weight:800;font-size:16px}
  .send:disabled{background:var(--card-2);color:var(--ink-3);cursor:not-allowed}

  /* foto ampliada */
  .zoom{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:16px}
  .zoom.open{display:flex}
  .zoom-card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;width:min(560px,100%);max-height:100%;overflow-y:auto}
  .zoom-card img{width:100%;display:block;max-height:60vh;object-fit:cover}
  .zoom-card .body{padding:18px}
  .zoom-card .desc{-webkit-line-clamp:unset;font-size:15px}

  .toast{position:fixed;left:50%;top:76px;transform:translate(-50%,-10px);background:#fff;color:#111;padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:.2s;z-index:100;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<header>
  <div class="container nav">
    <a href="#" class="logo"><b>Aramé</b><span>Արամէ</span></a>
    <button class="cart-btn" id="cartBtn" aria-label="Ver mi pedido">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14l-1.5 11a2 2 0 0 1-2 1.7h-7a2 2 0 0 1-2-1.7z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg>
      Mi pedido <span class="count" id="cartCount">0</span>
    </button>
  </div>
</header>

<section class="hero">
  <div class="container">
    <span class="kicker">Cocina armenia · Take away</span>
    <h1>Armá tu pedido <em>en un minuto</em></h1>
    <p>Elegí los productos y las cantidades, y mandanos el pedido por WhatsApp. Te respondemos para confirmar y coordinar el pago.</p>
    <div class="facts">
      <span class="fact"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><b id="fDir"></b></span>
      <span class="fact"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="fHor"></span></span>
    </div>
    <div class="aviso" id="aviso" hidden></div>
  </div>
</section>

<div class="toolbar">
  <div class="container">
    <div class="chips" id="chips"></div>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Buscar producto" aria-label="Buscar producto">
    </label>
  </div>
</div>

<main class="container" id="list"><div class="loading">Cargando productos…</div></main>

<footer>
  <div class="container">
    <span>© <span id="year"></span> Aramé · Cocina armenia</span>
    <span>Diseñado por <b>RT Design</b></span>
  </div>
</footer>

<button class="bar" id="bar" aria-label="Ver mi pedido">
  <span class="t"><small id="barCount"></small><b id="barTotal"></b></span>
  <span class="go">Ver pedido →</span>
</button>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-label="Tu pedido" aria-hidden="true">
  <div class="d-head">
    <h2>Tu pedido</h2>
    <button class="x" id="closeCart" aria-label="Cerrar">✕</button>
  </div>
  <div class="d-body">
    <div id="lines"></div>
    <div class="form" id="form">
      <h3>Tus datos</h3>
      <div class="seg" id="seg">
        <button data-mode="retiro" class="on">Retiro en el local</button>
        <button data-mode="envio">Envío</button>
      </div>
      <label>Nombre<input id="fName" autocomplete="name" placeholder="Tu nombre"></label>
      <label id="addrWrap" hidden>Dirección<input id="fAddr" autocomplete="street-address" placeholder="Calle, número, localidad"></label>
      <label>¿Para cuándo? (opcional)<input id="fWhen" placeholder="Ej: sábado al mediodía"></label>
      <label>Aclaraciones (opcional)<textarea id="fNotes" rows="2" placeholder="Algo que tengamos que saber"></textarea></label>
    </div>
  </div>
  <div class="d-foot">
    <div class="sum"><span>Total</span><span id="sTotal">$0</span></div>
    <p class="note" id="sNote"></p>
    <button class="send" id="sendBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.3-.5.1-1 .1-1.7-.1-.4-.1-.9-.3-1.5-.6-2.7-1.2-4.4-3.9-4.6-4.1-.1-.2-1.1-1.4-1.1-2.7s.7-1.9.9-2.2c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 2 1.1 1 2 1.3 2.3 1.4.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>
      Enviar pedido por WhatsApp
    </button>
  </div>
</aside>

<div class="zoom" id="zoom"><div class="zoom-card" id="zoomCard"></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const money = n => "$" + Math.round(n).toLocaleString("es-AR");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
};
const UNIT = {unidad:"c/u", docena:"la docena", porción:"la porción", kg:"el kg", pote:"el pote", bandeja:"la bandeja"};
const UNIT_PLURAL = {unidad:["unidad","unidades"], docena:["docena","docenas"], porción:["porción","porciones"], kg:["kg","kg"], pote:["pote","potes"], bandeja:["bandeja","bandejas"]};
const unitName = (u, q) => { const p = UNIT_PLURAL[u]; return p ? p[q === 1 ? 0 : 1] : (u || ""); };
const hasPrice = p => typeof p.precio === "number" && p.precio > 0;

let DATA = null, byId = {};
let cart = store.get("arame.cart", {});
let activeCat = "Todo", query = "", mode = "retiro";

async function load(){
  try{
    const r = await fetch("catalogo.json?v=" + Date.now(), {cache:"no-store"});
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json();
  }catch(e){
    $("#list").innerHTML = `<div class="empty">No pudimos cargar los productos. Probá recargar la página.</div>`;
    return;
  }
  DATA.productos = (DATA.productos || []);
  byId = Object.fromEntries(DATA.productos.map(p => [p.id, p]));
  for (const id in cart) if (!byId[id] || byId[id].disponible === false || !(cart[id] > 0)) delete cart[id];
  const n = DATA.negocio || {};
  $("#fDir").textContent = n.direccion || "";
  $("#fHor").textContent = n.horario || "";
  if (n.aviso){ $("#aviso").textContent = n.aviso; $("#aviso").hidden = false; }
  renderChips(); renderList(); renderCart();
}

function categories(){
  const used = [...new Set(DATA.productos.map(p => p.categoria || "Otros"))];
  const ordered = (DATA.categorias || []).filter(c => used.includes(c));
  return [...ordered, ...used.filter(c => !ordered.includes(c))];
}

function renderChips(){
  const cats = ["Todo", ...categories()];
  $("#chips").innerHTML = cats.map(c => `<button class="chip ${c === activeCat ? "on" : ""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
}
$("#chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  activeCat = b.dataset.cat; renderChips(); renderList();
  window.scrollTo({top: $("#list").offsetTop - 140, behavior: "smooth"});
});
$("#search").addEventListener("input", e => { query = e.target.value.trim(); renderList(); });

function photo(p, cls = ""){
  return p.foto ? `<img src="${esc(p.foto)}" alt="${esc(p.nombre)}" loading="lazy" class="${cls}">` : `<span class="none">Ա</span>`;
}

function cardHTML(p){
  const q = cart[p.id] || 0, off = p.disponible === false;
  const priceHTML = hasPrice(p)
    ? `<span class="price">${money(p.precio)}</span><span class="per">${UNIT[p.unidad] || (p.unidad ? "por " + esc(p.unidad) : "")}</span>`
    : `<span class="price na">Precio a consultar</span>`;
  const quick = p.unidad === "unidad" ? `<button class="quick" data-add="${p.id}" data-n="6">+6</button><button class="quick" data-add="${p.id}" data-n="12">+12</button>` : "";
  const ctrl = off ? `<div class="off-tag">Sin stock por ahora</div>` : `
    <div class="ctrl">
      <div class="stepper">
        <button data-add="${p.id}" data-n="-1" aria-label="Quitar uno">−</button>
        <input type="number" inputmode="numeric" min="0" value="${q || ""}" placeholder="0" data-qty="${p.id}" aria-label="Cantidad de ${esc(p.nombre)}">
        <button data-add="${p.id}" data-n="1" aria-label="Agregar uno">+</button>
      </div>${quick}
    </div>`;
  return `<article class="card ${q ? "in" : ""} ${off ? "off" : ""}" data-card="${p.id}">
    <button class="ph" data-zoom="${p.id}" aria-label="Ver ${esc(p.nombre)}">${photo(p)}${q ? `<span class="qbadge">${q}</span>` : ""}</button>
    <div class="body">
      <h3>${esc(p.nombre)}</h3>
      ${p.peso ? `<span class="peso">${esc(p.peso)}</span>` : ""}
      ${p.descripcion ? `<p class="desc">${esc(p.descripcion)}</p>` : ""}
      <div class="price-row">${priceHTML}</div>
      ${ctrl}
    </div>
  </article>`;
}

function renderList(){
  const q = norm(query);
  const match = p => !q || norm(p.nombre + " " + (p.descripcion || "") + " " + (p.categoria || "")).includes(q);
  const cats = activeCat === "Todo" ? categories() : [activeCat];
  let html = "";
  for (const c of cats){
    const items = DATA.productos.filter(p => (p.categoria || "Otros") === c && match(p))
      .sort((a, b) => (a.disponible === false) - (b.disponible === false));
    if (!items.length) continue;
    html += `<section class="cat-block"><h2>${esc(c)} <small>${items.length}</small></h2><div class="grid">${items.map(cardHTML).join("")}</div></section>`;
  }
  $("#list").innerHTML = html || `<div class="empty">No encontramos “${esc(query)}”.</div>`;
}

/* actualiza solo la tarjeta tocada, así no se pierde el foco al escribir */
function refreshCard(id){
  const el = document.querySelector(`[data-card="${CSS.escape(id)}"]`);
  if (!el) return;
  const q = cart[id] || 0;
  el.classList.toggle("in", q > 0);
  const ph = el.querySelector(".ph");
  let b = ph.querySelector(".qbadge");
  if (q && !b){ b = document.createElement("span"); b.className = "qbadge"; ph.appendChild(b); }
  if (b){ if (q) b.textContent = q; else b.remove(); }
  const inp = el.querySelector("[data-qty]");
  if (inp && document.activeElement !== inp) inp.value = q || "";
}

function setQty(id, q, silent){
  q = Math.max(0, Math.min(9999, Math.floor(Number(q) || 0)));
  const prev = cart[id] || 0;
  if (q) cart[id] = q; else delete cart[id];
  store.set("arame.cart", cart);
  refreshCard(id); renderCart();
  if (!silent && q > prev){
    const btn = $("#cartBtn"); btn.classList.remove("bump"); void btn.offsetWidth; btn.classList.add("bump");
  }
}

document.addEventListener("click", e => {
  const a = e.target.closest("[data-add]");
  if (a){ setQty(a.dataset.add, (cart[a.dataset.add] || 0) + Number(a.dataset.n)); return; }
  const z = e.target.closest("[data-zoom]");
  if (z){ openZoom(z.dataset.zoom); return; }
  const rm = e.target.closest("[data-rm]");
  if (rm){ setQty(rm.dataset.rm, 0); refreshLines(); }
});
document.addEventListener("input", e => {
  const i = e.target.closest("[data-qty]");
  if (i) setQty(i.dataset.qty, i.value, true);
});
document.addEventListener("focusin", e => { if (e.target.matches("[data-qty]")) e.target.select(); });

function totals(){
  const items = Object.entries(cart).filter(([id]) => byId[id]).map(([id, q]) => ({p: byId[id], q}));
  const priced = items.filter(i => hasPrice(i.p));
  return {
    items,
    units: items.reduce((a, i) => a + i.q, 0),
    total: priced.reduce((a, i) => a + i.p.precio * i.q, 0),
    pending: items.length - priced.length,
  };
}

function lineHTML({p, q}){
  return `<div class="li">
    <div class="n">${esc(p.nombre)}<small>${hasPrice(p) ? money(p.precio) + " " + (UNIT[p.unidad] || "") : "Precio a consultar"}</small></div>
    <div class="tot">${hasPrice(p) ? money(p.precio * q) : "—"}</div>
    <div class="stepper">
      <button data-add="${p.id}" data-n="-1" aria-label="Quitar uno">−</button>
      <input type="number" inputmode="numeric" min="0" value="${q}" data-qty="${p.id}" aria-label="Cantidad">
      <button data-add="${p.id}" data-n="1" aria-label="Agregar uno">+</button>
    </div>
    <button class="rm" data-rm="${p.id}">Quitar</button>
  </div>`;
}

function refreshLines(){
  const t = totals();
  $("#lines").innerHTML = t.items.length
    ? t.items.map(lineHTML).join("") + `<button class="clear" id="clearCart">Vaciar pedido</button>`
    : `<div class="empty">Todavía no agregaste productos.</div>`;
  $("#form").hidden = !t.items.length;
}

function renderCart(){
  const t = totals();
  $("#cartCount").textContent = t.units;
  $("#bar").classList.toggle("show", t.units > 0 && !$("#drawer").classList.contains("open"));
  $("#barCount").textContent = `${t.items.length} ${t.items.length === 1 ? "producto" : "productos"} · ${t.units} u.`;
  $("#barTotal").innerHTML = money(t.total) + (t.pending ? ` <small style="font-size:12px;opacity:.75">+ a consultar</small>` : "");
  $("#sTotal").textContent = money(t.total);
  $("#sNote").textContent = t.pending
    ? `${t.pending} ${t.pending === 1 ? "producto tiene" : "productos tienen"} precio a consultar. El total final te lo confirmamos por WhatsApp.`
    : "El pago lo coordinamos por WhatsApp.";
  $("#sendBtn").disabled = !t.items.length;
  // si el carrito está abierto, refrescar líneas sin pisar el campo que se está editando
  if ($("#drawer").classList.contains("open")){
    const f = document.activeElement;
    if (!(f && f.matches("#lines [data-qty]"))) refreshLines();
    else {
      const p = byId[f.dataset.qty], q = cart[f.dataset.qty] || 0;
      const tot = f.closest(".li").querySelector(".tot");
      if (p && tot) tot.textContent = hasPrice(p) ? money(p.precio * q) : "—";
    }
  }
}

function openCart(){
  refreshLines();
  $("#drawer").classList.add("open"); $("#overlay").classList.add("open");
  $("#drawer").setAttribute("aria-hidden", "false"); $("#bar").classList.remove("show");
}
function closeCart(){
  $("#drawer").classList.remove("open"); $("#overlay").classList.remove("open");
  $("#drawer").setAttribute("aria-hidden", "true");
  renderList(); renderCart();
}
$("#cartBtn").onclick = openCart; $("#bar").onclick = openCart;
$("#closeCart").onclick = closeCart; $("#overlay").onclick = closeCart;
document.addEventListener("keydown", e => { if (e.key === "Escape"){ closeCart(); closeZoom(); } });
$("#lines").addEventListener("click", e => {
  if (e.target.id === "clearCart" && confirm("¿Vaciar todo el pedido?")){
    cart = {}; store.set("arame.cart", cart); refreshLines(); renderCart();
  }
});
$("#lines").addEventListener("focusout", () => setTimeout(() => {
  if (!document.activeElement || !document.activeElement.matches("#lines [data-qty]")) refreshLines();
}, 0));

$("#seg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  mode = b.dataset.mode;
  [...$("#seg").children].forEach(x => x.classList.toggle("on", x === b));
  $("#addrWrap").hidden = mode !== "envio";
});

const saved = store.get("arame.cliente", {});
$("#fName").value = saved.name || ""; $("#fAddr").value = saved.addr || "";

$("#sendBtn").onclick = () => {
  const t = totals(); if (!t.items.length) return;
  const name = $("#fName").value.trim(), addr = $("#fAddr").value.trim();
  const when = $("#fWhen").value.trim(), notes = $("#fNotes").value.trim();
  $("#fName").classList.toggle("err", !name);
  $("#fAddr").classList.toggle("err", mode === "envio" && !addr);
  if (!name || (mode === "envio" && !addr)){
    toast(mode === "envio" ? "Completá tu nombre y dirección" : "Completá tu nombre");
    (!name ? $("#fName") : $("#fAddr")).focus();
    return;
  }
  store.set("arame.cliente", {name, addr});
  const msg = [
    `¡Hola ${DATA.negocio?.nombre || "Aramé"}! Quiero hacer este pedido:`, "",
    ...t.items.map(({p, q}) => `• ${q} ${unitName(p.unidad, q)} — ${p.nombre}` + (hasPrice(p) ? ` (${money(p.precio * q)})` : " (precio a consultar)")),
    "",
    `*Total: ${money(t.total)}*` + (t.pending ? " + productos a consultar" : ""),
    "",
    `Nombre: ${name}`,
    mode === "envio" ? `Envío a: ${addr}` : "Retiro en el local",
    ...(when ? [`Para: ${when}`] : []),
    ...(notes ? [`Aclaraciones: ${notes}`] : []),
  ].join("\n");
  const num = String(DATA.negocio?.whatsapp || "").replace(/\D/g, "");
  window.open(`https://wa.me/${num}?text=${encodeURIComponent(msg)}`, "_blank", "noopener");
};

function openZoom(id){
  const p = byId[id]; if (!p) return;
  $("#zoomCard").innerHTML = `${p.foto ? `<img src="${esc(p.foto)}" alt="${esc(p.nombre)}">` : ""}
    <div class="body">
      <h3 style="font-size:22px">${esc(p.nombre)}</h3>
      ${p.peso ? `<span class="peso">${esc(p.peso)}</span>` : ""}
      <p class="desc">${esc(p.descripcion || "")}</p>
      <div class="price-row">${hasPrice(p) ? `<span class="price">${money(p.precio)}</span><span class="per">${UNIT[p.unidad] || ""}</span>` : `<span class="price na">Precio a consultar</span>`}</div>
      <button class="send" style="background:var(--or);color:#111" data-close-zoom>Volver</button>
    </div>`;
  $("#zoom").classList.add("open");
}
function closeZoom(){ $("#zoom").classList.remove("open"); }
$("#zoom").addEventListener("click", e => { if (e.target.id === "zoom" || e.target.closest("[data-close-zoom]")) closeZoom(); });

function toast(m){
  const el = $("#toast"); el.textContent = m; el.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 1800);
}

$("#year").textContent = new Date().getFullYear();
load();
</script>
</body>
</html>
